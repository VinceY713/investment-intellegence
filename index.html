<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>理性仓位管理工具</title>
  <script>
    // 尽早设置主题，避免刷新时白/黑闪烁
    (function () {
      try {
        var t = localStorage.getItem('rpm.theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7 3v5c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6z"/><path d="M9 12l2 2 4-4"/>
        </svg>
      </span>
      <div>
        <h1>理性仓位管理工具</h1>
        <p class="tagline">投资纪律的守门员 · 不预测涨跌，只约束人性</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" title="切换白天 / 黑夜模式" aria-label="切换主题"></button>
      <span class="storage-badge" title="全部数据保存在你自己的服务器（多设备同步、清缓存自动恢复）；本机浏览器保留一份离线缓存">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px">
          <rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
        </svg>
        <span id="storage-badge-text">云端同步</span>
      </span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="portfolio">投资组合</button>
    <button class="tab" data-view="trends">资产趋势</button>
    <button class="tab" data-view="dashboard">股票体检</button>
    <button class="tab" data-view="positions">持仓</button>
    <button class="tab" data-view="kelly">① 凯利定注</button>
    <button class="tab" data-view="diversify">② 组合分散</button>
    <button class="tab" data-view="drawdown">③ 回撤控制</button>
    <button class="tab" data-view="stoploss">④ 止损防御</button>
    <button class="tab" data-view="rules">⑤ 铁律校验</button>
    <button class="tab" data-view="planner">⑥ 加仓/利润</button>
    <button class="tab" data-view="help">使用说明</button>
    <button class="tab" data-view="settings">设置</button>
  </nav>

  <main id="app"></main>

  <footer class="footer">
    <span>核心不是预测市场，而是约束人性 · 所有模型依赖你的诚实输入</span>
  </footer>

  <!-- Blocking modal for iron-rule confirmations -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
