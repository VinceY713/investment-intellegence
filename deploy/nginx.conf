# 理性仓位管理工具 —— Nginx 站点配置
# 放到 /etc/nginx/conf.d/investment-intelligence.conf
# 修改 server_name 为你的域名；没有域名时用 _ （默认站点）即可通过公网 IP 访问。

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # ← 改成你的域名，如 tools.example.com

    root /var/www/investment-intelligence;
    index index.html;

    # SPA/静态站点：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 原型阶段频繁更新：关闭缓存，避免部署后看到旧版本。
    # 上线稳定后可改为对 css/js 加 hash 文件名并开启长缓存。
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/investment-intelligence.access.log;
    error_log  /var/log/nginx/investment-intelligence.error.log;
}
