# 理性仓位管理工具 —— Nginx 站点配置
# 放到 /etc/nginx/conf.d/investment-intelligence.conf
# 修改 server_name 为你的域名；没有域名时用 _ （默认站点）即可通过公网 IP 访问。

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # ← 改成你的域名，如 tools.example.com

    root /var/www/investment-intelligence;
    index index.html;

    # 进入网页前的密码验证（Basic Auth）
    # 口令文件 /etc/nginx/.htpasswd 由 GitHub Actions 用 APP_PASSWORD 自动生成（用户名 admin）。
    # 实际部署以工作流 deploy.yml 写入的配置为准，此文件仅作参考。
    auth_basic "请输入访问密码";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # SPA/静态站点：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 原型阶段频繁更新：关闭缓存，避免部署后看到旧版本。
    # 上线稳定后可改为对 css/js 加 hash 文件名并开启长缓存。
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # 行情代理：浏览器同源请求 /api/quote?code=sh600000 → 新浪财经
    # （静态页无法直连行情源，用服务器代理规避 CORS 与 Referer 限制）
    location = /api/quote {
        proxy_pass https://hq.sinajs.cn/list=$arg_code;
        proxy_set_header Host hq.sinajs.cn;
        proxy_set_header Referer https://finance.sina.com.cn;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_ssl_name hq.sinajs.cn;
        resolver 119.29.29.29 223.5.5.5 valid=300s;
        resolver_timeout 5s;
        add_header Cache-Control "no-store";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/investment-intelligence.access.log;
    error_log  /var/log/nginx/investment-intelligence.error.log;
}
