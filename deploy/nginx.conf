# 理性仓位管理工具 —— Nginx 站点配置
# 放到 /etc/nginx/conf.d/investment-intelligence.conf
# 修改 server_name 为你的域名；没有域名时用 _ （默认站点）即可通过公网 IP 访问。

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # ← 改成你的域名，如 tools.example.com

    root /var/www/investment-intelligence;
    index index.html;

    # 进入网页前的密码验证（Basic Auth）
    # 口令文件 /etc/nginx/.htpasswd 由 GitHub Actions 用 APP_PASSWORD 自动生成（用户名 admin）。
    # 实际部署以工作流 deploy.yml 写入的配置为准，此文件仅作参考。
    auth_basic "请输入访问密码";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # SPA/静态站点：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 原型阶段频繁更新：关闭缓存，避免部署后看到旧版本。
    # 上线稳定后可改为对 css/js 加 hash 文件名并开启长缓存。
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # 行情代理（主）：浏览器同源请求 /api/quote?code=sh600000 → 腾讯行情
    # （静态页无法直连行情源，用服务器代理规避 CORS；腾讯无需 Referer，较稳）
    location = /api/quote {
        proxy_pass https://qt.gtimg.cn/q=$arg_code;
        proxy_set_header Host qt.gtimg.cn;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_ssl_name qt.gtimg.cn;
        resolver 119.29.29.29 223.5.5.5 valid=300s;
        resolver_timeout 5s;
        add_header Cache-Control "no-store";
    }
    # 行情代理（备）：新浪财经（前端在腾讯失败时自动回退）
    location = /api/quote_sina {
        proxy_pass https://hq.sinajs.cn/list=$arg_code;
        proxy_set_header Host hq.sinajs.cn;
        proxy_set_header Referer https://finance.sina.com.cn;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_ssl_name hq.sinajs.cn;
        resolver 119.29.29.29 223.5.5.5 valid=300s;
        resolver_timeout 5s;
        add_header Cache-Control "no-store";
    }

    # 基金净值代理：/api/fund?code=000051 → 天天基金实时估值（jsonpgz 回包，盘中近似）
    location = /api/fund {
        proxy_pass https://fundgz.1234567.com.cn/js/$arg_code.js;
        proxy_set_header Host fundgz.1234567.com.cn;
        proxy_set_header Referer https://fund.eastmoney.com/;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_ssl_name fundgz.1234567.com.cn;
        resolver 119.29.29.29 223.5.5.5 valid=300s;
        resolver_timeout 5s;
        add_header Cache-Control "no-store";
    }

    # 基金确认净值：/api/fund_nav?code=020602 → 东方财富历史净值（与官方/同花顺一致）
    # eastmoney CDN 需 HTTP/1.1，故强制 1.1 + 清空 Connection + 补 Accept/TLS
    location = /api/fund_nav {
        proxy_pass https://api.fund.eastmoney.com/f10/lsjz?fundCode=$arg_code&pageIndex=1&pageSize=2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.fund.eastmoney.com;
        proxy_set_header Referer https://fundf10.eastmoney.com/;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "*/*";
        proxy_ssl_server_name on;
        proxy_ssl_name api.fund.eastmoney.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        resolver 119.29.29.29 223.5.5.5 valid=300s;
        resolver_timeout 5s;
        add_header Cache-Control "no-store";
    }

    # 黄金代理：/api/gold → 腾讯伦敦金 hf_XAU（美元/盎司，与股票同源、HTTP/1.1 稳），前端 ×汇率÷31.1 折人民币/克
    # （东方财富 push2 只认 HTTP/2，nginx 无法代理，故用腾讯源）
    location = /api/gold {
        proxy_pass https://qt.gtimg.cn/q=hf_XAU;
        proxy_set_header Host qt.gtimg.cn;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_ssl_name qt.gtimg.cn;
        resolver 119.29.29.29 223.5.5.5 valid=300s;
        resolver_timeout 5s;
        add_header Cache-Control "no-store";
    }

    # 汇率代理：/api/fxrate → 中国货币网人民币汇率中间价（每日）
    location = /api/fxrate {
        proxy_pass https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/fx/ccpr.json;
        proxy_set_header Host www.chinamoney.com.cn;
        proxy_set_header Referer https://www.chinamoney.com.cn/chinese/bkccpr/;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_ssl_name www.chinamoney.com.cn;
        resolver 119.29.29.29 223.5.5.5 valid=300s;
        resolver_timeout 5s;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    # 快照云端存储：GET 读取 / PUT 写入 单文件 JSON（Nginx 内置 WebDAV，无需额外后端）
    # URL /api/snapshots → 文件 /var/lib/investment-intelligence/store/api/snapshots
    # 需先创建目录并授权：
    #   sudo mkdir -p /var/lib/investment-intelligence/store/api /var/lib/investment-intelligence/store/tmp
    #   sudo chown -R www-data:www-data /var/lib/investment-intelligence && sudo chmod -R 775 /var/lib/investment-intelligence
    location = /api/state {
        root /var/lib/investment-intelligence/store;
        client_body_temp_path /var/lib/investment-intelligence/store/tmp;
        client_max_body_size 16m;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store";
    }
    location = /api/snapshots {
        root /var/lib/investment-intelligence/store;
        client_body_temp_path /var/lib/investment-intelligence/store/tmp;
        client_max_body_size 8m;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store";
    }

    # AI 代理：浏览器同源 POST /api/ai-review → DeepSeek
    # 密钥由 /etc/nginx/ai_key.conf（proxy_set_header Authorization "Bearer <key>";）注入，
    # 该文件由 GitHub Actions 用 DEEPSEEK_API_KEY 生成（600 权限），不进本配置、不进前端。
    location = /api/ai-review {
        proxy_pass https://api.deepseek.com/chat/completions;
        proxy_set_header Host api.deepseek.com;
        proxy_set_header Content-Type application/json;
        include /etc/nginx/ai_key.conf;
        proxy_ssl_server_name on;
        proxy_ssl_name api.deepseek.com;
        resolver 119.29.29.29 223.5.5.5 valid=300s;
        resolver_timeout 5s;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/investment-intelligence.access.log;
    error_log  /var/log/nginx/investment-intelligence.error.log;
}
