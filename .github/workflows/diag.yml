name: Server Diagnostics (read-only)

# 只读诊断：在 ECS 上按真实链路 curl 各 /api 代理端点，打印 HTTP 状态与响应头部片段，
# 外加 nginx 错误日志与快照 cron 日志尾部。全程不写任何文件、不改配置、不重启服务。
# 用途：定位数据源是否被封/字段刻度是否正确（沙箱与本地都无法访问这些境内源）。
on:
  workflow_dispatch:
    inputs:
      stock:
        description: '用于取数的 A 股代码（默认 002518 科士达）'
        required: false
        default: '002518'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Run read-only probes on ECS
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          STOCK: ${{ github.event.inputs.stock || '002518' }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          envs: APP_PASSWORD,STOCK
          script: |
            AUTH="admin:$APP_PASSWORD"
            # probe <标签> <路径> [截取字节数]
            probe() {
              local label="$1" path="$2" n="${3:-600}"
              local body code
              body=$(curl -s -m 20 -u "$AUTH" -w $'\n__CODE__%{http_code}' "http://127.0.0.1${path}" 2>&1)
              code=$(printf '%s' "$body" | tail -n1 | sed 's/__CODE__//')
              echo "===== $label"
              echo "--- path: $path"
              echo "--- http: $code"
              printf '%s' "$body" | sed '$d' | head -c "$n"
              echo ""
              echo ""
            }

            echo "########## 1. 基本面字段（关键：核对 ROE/PE/PB/毛利率 的真实刻度）"
            SECID="0.$STOCK"
            case "$STOCK" in 6*|5*|11*|13*) SECID="1.$STOCK";; esac
            probe "emquote 基本面 $SECID" "/api/emquote?secid=$SECID&fields=f43,f57,f58,f59,f105,f116,f162,f167,f173,f183,f184,f185,f186,f187,f188" 900

            echo "########## 2. 个股资金流字段"
            probe "emquote 资金流 $SECID" "/api/emquote?secid=$SECID&fields=f62,f184,f66,f69,f72,f75,f78" 600

            echo "########## 3. 个股公告（消息面数据源）"
            probe "emann 公告 $STOCK" "/api/emann?cb=&sr=-1&page_size=5&page_index=1&ann_type=A&client_source=web&f_node=0&stock_list=$STOCK" 700

            echo "########## 4. 美股日K（push2his：第三方称近期封服务器IP，此处求证）"
            probe "uskline 105.AAPL" "/api/uskline?secid=105.AAPL&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f53&klt=101&fqt=1&beg=20250101&end=20260731" 400
            probe "uskline 107.SPY" "/api/uskline?secid=107.SPY&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f53&klt=101&fqt=0&beg=20250101&end=20260731" 400

            echo "########## 5. 美股指数日K（腾讯 newfqkline，第三方新加）"
            probe "usidxkline usINX" "/api/usidxkline?param=usINX,day,,,20,qfq" 400
            probe "usidxkline usNDX" "/api/usidxkline?param=usNDX,day,,,20,qfq" 300

            echo "########## 6. 资金流向卡的三个源"
            probe "emflow 行业主力" "/api/emflow?fid=f62&po=1&pz=3&pn=1&np=1&fltt=2&invt=2&fs=m%3A90%2Bt%3A2&fields=f12,f14,f62,f164,f174,f184" 500
            probe "emflow 广期所(碳酸锂)" "/api/emflow?fid=f12&po=0&pz=10&pn=1&np=1&fltt=2&invt=2&fs=m%3A225&fields=f2,f3,f12,f14" 500
            probe "emmacro 南向" "/api/emmacro?reportName=RPT_MUTUAL_DEAL_HISTORY&columns=ALL&sortColumns=TRADE_DATE&sortTypes=-1&pageSize=1&pageNumber=1&filter=%28MUTUAL_TYPE%3D%22003%22%29" 400

            echo "########## 7. 商品价格（腾讯外盘 hf_ / 广期所官方）"
            probe "quote hf_GC 黄金" "/api/quote?code=hf_GC" 300
            probe "quote hf_CAD 铜" "/api/quote?code=hf_CAD" 300
            YD=$(date -d '1 day ago' +%Y%m%d 2>/dev/null || date +%Y%m%d)
            probe "gfex 碳酸锂 $YD" "/api/gfex?trade_date=$YD" 500

            echo "########## 7b. 基本面兜底源（东财数据中心：估值分析 + F10 主指标）"
            probe "dc 估值分析 $STOCK" "/api/emmacro?reportName=RPT_VALUEANALYSIS_DET&columns=ALL&filter=%28SECURITY_CODE%3D%22$STOCK%22%29&pageSize=1&source=WEB&client=WEB" 600
            SUF=".SZ"; case "$STOCK" in 6*|5*|11*|13*) SUF=".SH";; esac
            probe "dc F10主指标 $STOCK$SUF" "/api/emmacro?reportName=RPT_F10_FINANCE_MAINFINADATA&columns=ALL&filter=%28SECUCODE%3D%22$STOCK$SUF%22%29&pageSize=1&sortColumns=REPORT_DATE&sortTypes=-1&source=HSF10&client=PC" 800

            echo "########## 8. A股日K与基金净值（已知可用，作对照组）"
            probe "kline sz$STOCK" "/api/kline?param=sz$STOCK,day,,,5,qfq" 300
            probe "fundhist 020602" "/api/fundhist?fundCode=020602&pageIndex=1&pageSize=2" 400

            echo "########## 8b. 【根因判定】绕过 nginx 直连 push2：区分「IP被封」还是「nginx不支持HTTP/2上游」"
            for U in "https://push2.eastmoney.com/api/qt/stock/get?secid=0.002518&fields=f43,f58,f162,f167,f173" \
                     "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=105.AAPL&fields1=f1,f2&fields2=f51,f53&klt=101&fqt=1&beg=20250101&end=20260731"; do
              echo "--- URL: ${U%%\?*}"
              echo -n "    http1.1 : "; curl -s -m 15 --http1.1 -o /tmp/a1 -w "%{http_code} %{size_download}B" -A "Mozilla/5.0" -e "https://quote.eastmoney.com/" "$U" 2>&1; echo " | $(head -c 120 /tmp/a1 2>/dev/null)"
              echo -n "    http2   : "; curl -s -m 15 --http2 -o /tmp/a2 -w "%{http_code} %{size_download}B" -A "Mozilla/5.0" -e "https://quote.eastmoney.com/" "$U" 2>&1; echo " | $(head -c 120 /tmp/a2 2>/dev/null)"
            done
            echo ""

            echo "########## 8c. 美股个股能否走腾讯 newfqkline（uskline 已死，找替代）"
            probe "usidxkline usAAPL" "/api/usidxkline?param=usAAPL,day,,,20,qfq" 300
            probe "usidxkline usTCOM" "/api/usidxkline?param=usTCOM,day,,,20,qfq" 300

            echo "########## 8d. 广期所补 trade_type 参数（上轮只回「总计」空行）"
            for D in $(date -d '1 day ago' +%Y%m%d) $(date -d '2 days ago' +%Y%m%d); do
              echo "--- gfex 直连 $D"
              curl -s -m 15 -X POST "https://www.gfex.com.cn/u/interfaceCommon/getFutureDailyQuotes" \
                -H "Content-Type: application/x-www-form-urlencoded" -A "Mozilla/5.0" \
                --data "trade_date=$D&trade_type=0" 2>&1 | head -c 400; echo ""
            done
            echo ""

            echo "########## 8e. F10 主指标完整字段名（确认 ROE/毛利率/负债率 的键）"
            curl -s -m 20 -u "$AUTH" "http://127.0.0.1/api/emmacro?reportName=RPT_F10_FINANCE_MAINFINADATA&columns=ALL&filter=%28SECUCODE%3D%22${STOCK}.SZ%22%29&pageSize=1&sortColumns=REPORT_DATE&sortTypes=-1&source=HSF10&client=PC" 2>/dev/null \
              | tr ',' '\n' | grep -Ei '"(ROE|MLL|XSMLL|ZCFZL|MLR|TOTALOPERATEREVE|PARENTNETPROFIT|WEIGHTAVG|JROA)[A-Z]*"' | head -30
            echo ""

            echo "########## 8f. 美股K线：腾讯返回的代码带 .OQ/.N 后缀，试完整符号能否拿到完整序列"
            for S in usAAPL.OQ usTCOM.OQ usNVDA.OQ; do
              echo -n "--- $S : "
              curl -s -m 15 -u "$AUTH" "http://127.0.0.1/api/usidxkline?param=$S,day,,,20,qfq" 2>/dev/null | head -c 260; echo ""
            done
            echo ""

            echo "########## 8g. 个股/行业资金流的非 push2 替代（datacenter 报表）"
            probe "dc 个股资金流 RPT_DATA_STOCK_FLOW" "/api/emmacro?reportName=RPT_DATA_STOCK_FLOW&columns=ALL&filter=%28SECURITY_CODE%3D%22${STOCK}%22%29&pageSize=1&source=WEB&client=WEB" 300
            probe "dc 行业资金流 RPT_BKZJL" "/api/emmacro?reportName=RPT_BKZJL_ZJLRQS&columns=ALL&pageSize=2&source=WEB&client=WEB" 300
            probe "dc 板块资金 RPT_DFZJL" "/api/emmacro?reportName=RPT_DFZJL_HYZJL&columns=ALL&pageSize=2&source=WEB&client=WEB" 300

            echo "########## 9. nginx 错误日志（尾部 40 行）"
            sudo tail -n 40 /var/log/nginx/error.log 2>/dev/null || tail -n 40 /var/log/nginx/error.log 2>/dev/null || echo "(读不到 error.log)"
            echo ""

            echo "########## 10. 快照 cron 日志（尾部 25 行）"
            sudo tail -n 25 /var/log/ii-snapshot.log 2>/dev/null || tail -n 25 /var/log/ii-snapshot.log 2>/dev/null || echo "(读不到 ii-snapshot.log)"
            echo ""

            echo "########## 11. 出口 IP 与 DNS（判断是否被数据源按 IP 封禁）"
            curl -s -m 10 https://myip.ipip.net 2>/dev/null || curl -s -m 10 ifconfig.me 2>/dev/null || echo "(取不到出口IP)"
            echo ""
            echo "diag done."
