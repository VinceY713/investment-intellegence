name: Deploy to Aliyun ECS

# 触发条件：推送到仓库默认分支时自动部署；也可在 Actions 页手动运行
# 注意：本仓库当前唯一分支为 claude/prototype-development-f9gwtq，
# 原先只列 main/master 会导致推送后部署从不触发。
on:
  push:
    branches: [main, master, claude/prototype-development-f9gwtq]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# 避免并发部署互相覆盖
concurrency:
  group: deploy-ecs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject build id and generate version.json
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA}/" index.html
          printf '{"build":"%s","time":"%s"}\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

      - name: Copy static files to ECS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "index.html,styles.css,app.js,version.json,README.md,deploy/snapshot-cron.py"
          target: "/var/www/investment-intelligence"
          overwrite: true

      # 根路径占位页（KEHU Platform）：/var/www/kehu-platform/index.html，未来 KEHU 在此开发
      # 先确保目录存在（/var/www 归 root 所有，ubuntu 用户无写权限，SCP 无法自建目录）
      - name: Prepare KEHU platform dir (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          script: |
            sudo mkdir -p /var/www/kehu-platform
            sudo chown $USER:$USER /var/www/kehu-platform

      - name: Copy KEHU platform placeholder (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "kehu-platform/index.html"
          target: "/var/www/kehu-platform"
          overwrite: true

      - name: Configure password gate, nginx & reload (SSH)
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          envs: APP_PASSWORD,DEEPSEEK_API_KEY
          script: |
            set -e
            # 1) 用 APP_PASSWORD 生成访问口令文件（用户名固定为 admin）
            if [ -z "$APP_PASSWORD" ]; then
              echo "❌ 未配置 GitHub Secret：APP_PASSWORD"; exit 1
            fi
            echo "admin:$(openssl passwd -apr1 "$APP_PASSWORD")" | sudo tee /etc/nginx/.htpasswd >/dev/null
            sudo chmod 644 /etc/nginx/.htpasswd

            # 1b) 写 DeepSeek 密钥到独立 include 文件（密钥不进主配置、不进前端）
            echo "proxy_set_header Authorization \"Bearer ${DEEPSEEK_API_KEY:-MISSING}\";" | sudo tee /etc/nginx/ai_key.conf >/dev/null
            sudo chmod 600 /etc/nginx/ai_key.conf

            # 1c) 云端存储目录（Nginx WebDAV：PUT 写入 / GET 读取 单文件 JSON）
            #     store/api/state 为整份数据；store/tmp 为 PUT 临时目录（须与目标同一文件系统）
            sudo mkdir -p /var/lib/investment-intelligence/store/api /var/lib/investment-intelligence/store/tmp
            sudo chown -R www-data:www-data /var/lib/investment-intelligence
            sudo chmod -R 775 /var/lib/investment-intelligence

            # 1d) 安装每日快照定时任务（北京时间 22:00 / 23:00 / 23:30，三次互为冗余）
            #     纯前端页面只在浏览器打开时记录快照；此脚本在服务器端定时直接读写云端数据文件，
            #     即使当天没打开网页也能抓到当日（尤其傍晚公布的基金净值）快照。
            sudo cp /var/www/investment-intelligence/deploy/snapshot-cron.py /usr/local/bin/ii-snapshot.py
            sudo chmod 755 /usr/local/bin/ii-snapshot.py
            # 用 printf 逐行写 /etc/cron.d（避免 YAML 缩进给 cron 行带来前导空格）
            # CRON_TZ=Asia/Shanghai 让 cron 按北京时间触发，无需改服务器时区
            CRONLINE='/usr/bin/python3 /usr/local/bin/ii-snapshot.py >> /var/log/ii-snapshot.log 2>&1'
            printf 'CRON_TZ=Asia/Shanghai\n0 22 * * * root %s\n0 23 * * * root %s\n30 23 * * * root %s\n' "$CRONLINE" "$CRONLINE" "$CRONLINE" | sudo tee /etc/cron.d/ii-snapshot >/dev/null
            sudo chmod 644 /etc/cron.d/ii-snapshot
            sudo touch /var/log/ii-snapshot.log
            echo "已安装每日快照定时任务（22:00/23:00/23:30 北京时间）"

            # 1e) 让系统解析优先 IPv4：本机无 IPv6 出口路由，但 DNS 会返回 AAAA，
            #     nginx 对静态 host 的 proxy_pass 在启动时用 getaddrinfo 解析（resolver 的 ipv6=off 管不到），
            #     导致每个上游都先试一串 IPv6 地址、逐个 "Network is unreachable" 超时后才回退 IPv4。
            #     写入 gai.conf 的 IPv4 优先规则可消除这段无谓等待（幂等，重复执行不重复写）。
            if ! grep -q '^precedence ::ffff:0:0/96' /etc/gai.conf 2>/dev/null; then
              echo 'precedence ::ffff:0:0/96  100' | sudo tee -a /etc/gai.conf >/dev/null
              echo "已设置 gai.conf：解析优先 IPv4"
            else
              echo "gai.conf 已是 IPv4 优先，跳过"
            fi

            # 2) 写站点配置（含 Basic Auth 密码门）
            sudo tee /etc/nginx/conf.d/investment-intelligence.conf >/dev/null <<'NGINXCONF'
            server {
                listen 80;
                listen [::]:80;
                server_name _;
                root /var/www/investment-intelligence;
                index index.html;

                # 进入网页前的密码验证（用户名 admin，密码来自 APP_PASSWORD）
                auth_basic "请输入访问密码";
                auth_basic_user_file /etc/nginx/.htpasswd;

                # 根路径：KEHU Platform 占位页（公开可见，无密码）；投资智能已迁至 /personal/investmentmgm/
                location / {
                    auth_basic off;
                    root /var/www/kehu-platform;
                    index index.html;
                    try_files $uri $uri/ /index.html;
                }

                # 子路径入口：/personal/investmentmgm/ → 同一个站点（2026-08-21 起对外访问地址）
                # 前端资源（styles.css/app.js/version.json）是相对路径，会请求 /personal/investmentmgm/xxx；
                # rewrite 剥掉前缀后由 root 解析到 /var/www/investment-intelligence 下的同名文件。
                # 用 ^~ 阻止后面的正则缓存 location 拦截，避免它用 server root 找错文件路径。
                location ^~ /personal/investmentmgm/ {
                    rewrite ^/personal/investmentmgm/(.*)$ /$1 break;
                    root /var/www/investment-intelligence;
                    index index.html;
                    try_files $uri $uri/ /index.html;
                    add_header Cache-Control "no-store, must-revalidate";
                    expires -1;
                }
                # 无尾斜杠访问（/personal/investmentmgm）→ 301 补斜杠，避免相对资源路径解析错乱
                location = /personal/investmentmgm {
                    return 301 /personal/investmentmgm/;
                }

                # 行情代理（主）：浏览器同源 /api/quote?code=sh600000 → 腾讯行情
                location = /api/quote {
                    proxy_pass https://qt.gtimg.cn/q=$arg_code;
                    proxy_set_header Host qt.gtimg.cn;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_ssl_server_name on;
                    proxy_ssl_name qt.gtimg.cn;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    add_header Cache-Control "no-store";
                }
                # 行情代理（备）：新浪财经（腾讯失败时前端自动回退到这里）
                location = /api/quote_sina {
                    proxy_pass https://hq.sinajs.cn/list=$arg_code;
                    proxy_set_header Host hq.sinajs.cn;
                    proxy_set_header Referer https://finance.sina.com.cn;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_ssl_server_name on;
                    proxy_ssl_name hq.sinajs.cn;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    add_header Cache-Control "no-store";
                }

                # 基金净值代理：/api/fund?code=000051 → 天天基金实时估值（jsonpgz 回包，盘中近似）
                location = /api/fund {
                    proxy_pass https://fundgz.1234567.com.cn/js/$arg_code.js;
                    proxy_set_header Host fundgz.1234567.com.cn;
                    proxy_set_header Referer https://fund.eastmoney.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_ssl_server_name on;
                    proxy_ssl_name fundgz.1234567.com.cn;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    add_header Cache-Control "no-store";
                }

                # 基金确认净值：/api/fund_nav?code=020602 → 东方财富历史净值（与官方/同花顺一致）
                # eastmoney CDN 需 HTTP/1.1，故强制 1.1 + 清空 Connection + 补 Accept/TLS
                location = /api/fund_nav {
                    proxy_pass https://api.fund.eastmoney.com/f10/lsjz?fundCode=$arg_code&pageIndex=1&pageSize=2;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host api.fund.eastmoney.com;
                    proxy_set_header Referer https://fundf10.eastmoney.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name api.fund.eastmoney.com;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    add_header Cache-Control "no-store";
                }

                # 基金历史净值序列：/api/fundhist?fundCode=020602&pageIndex=1&pageSize=200 → 东财 lsjz 多行
                # 整段 query 透传（$is_args$args，与 /api/emmacro 同款最稳），前端拼好全部参数；拉场外基金真实相关/波动/回撤
                location = /api/fundhist {
                    proxy_pass https://api.fund.eastmoney.com/f10/lsjz$is_args$args;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host api.fund.eastmoney.com;
                    proxy_set_header Referer https://fundf10.eastmoney.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name api.fund.eastmoney.com;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 日K历史代理：/api/kline?param=sh600000,day,,,160,qfq → 腾讯前复权日K（算真实相关性/波动/历史最大回撤用）
                # 与 /api/quote 同为腾讯行情源；param 原样透传（含逗号，query 允许）
                location = /api/kline {
                    proxy_pass https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=$arg_param;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host web.ifzq.gtimg.cn;
                    proxy_set_header Referer https://gu.qq.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name web.ifzq.gtimg.cn;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 美股日K历史代理：/api/uskline?secid=105.AAPL&fields1=...&klt=101&fqt=1&beg=...&end=... → 东财 push2his
                # （原腾讯 usfqkline 2026-07 起只回 1~2 行已失效；东财 HTTP/1.1 可代理、数据完整）
                # secid 市场前缀：105 纳斯达克 / 106 纽交所 / 107 美交所(Arca ETF)；整段 query 透传，前端拼好全部参数
                location = /api/uskline {
                    proxy_pass https://push2his.eastmoney.com/api/qt/stock/kline/get$is_args$args;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host push2his.eastmoney.com;
                    proxy_set_header Referer https://quote.eastmoney.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name push2his.eastmoney.com;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 东财实时报价代理：/api/emquote?secid=100.UDI&fields=f43,f58,f59,f60 → push2 单标的报价
                # 用于：股票行情备用源（新浪封 IP 后的替代）、美元指数等宏观指标自动拉取
                location = /api/emquote {
                    proxy_pass https://push2.eastmoney.com/api/qt/stock/get$is_args$args;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host push2.eastmoney.com;
                    proxy_set_header Referer https://quote.eastmoney.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name push2.eastmoney.com;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 东财个股公告代理：/api/emann?stock_list=002518&page_size=30&... → 公告列表 JSON
                # 用于「决策卡 → 消息面评分」：拉真实公告标题+日期，AI 只对已检索到的标题做分类，
                # 绝不让模型凭记忆生成事件（模型有训练截止日，问它"最近有什么消息"必然虚构）。
                location = /api/emann {
                    proxy_pass https://np-anotice-stock.eastmoney.com/api/security/ann$is_args$args;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host np-anotice-stock.eastmoney.com;
                    proxy_set_header Referer https://data.eastmoney.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name np-anotice-stock.eastmoney.com;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 美股指数日K代理：/api/usidxkline?param=usINX,day,,,400,qfq → 腾讯 newfqkline
                # 用于基准对比的 标普500(usINX)/纳斯达克100(usNDX)；注意：对美股个股返回稀疏数据（只适用于指数）
                location = /api/usidxkline {
                    proxy_pass https://web.ifzq.gtimg.cn/appstock/app/newfqkline/get?param=$arg_param;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host web.ifzq.gtimg.cn;
                    proxy_set_header Referer https://gu.qq.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name web.ifzq.gtimg.cn;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 广期所官方日行情代理：/api/gfex?trade_date=20260724 → POST 表单到 gfex 官方接口
                # 碳酸锂等广期所品种价格（东财 push2 系对广期所 secid 返回 502 且当前被封，官方源最权威）
                # 关键：proxy_pass 必须用【变量】——① 静态 URI 时 nginx 会把浏览器 query 附加转发，
                #         与 body 里的 trade_date 合并成数组 → 上游返回空数据；
                #      ② rewrite 带 ? 清 query 的方案会同时清空 $arg_trade_date → body 参数变空。
                #      变量式 proxy_pass 默认不附加原始 query，$arg_trade_date 仍可用，两全。
                location = /api/gfex {
                    proxy_method POST;
                    proxy_set_body "trade_date=$arg_trade_date&trade_type=0";
                    set $gfex_upstream http://www.gfex.com.cn;
                    proxy_pass $gfex_upstream/u/interfacesWebTiDayQuotes/loadList;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host www.gfex.com.cn;
                    proxy_set_header Content-Type "application/x-www-form-urlencoded";
                    proxy_set_header User-Agent "Mozilla/5.0";
                    # 必须清掉浏览器的 Referer：广期所 WAF 防盗链，带外站 Referer 一律 403
                    proxy_set_header Referer "http://www.gfex.com.cn/";
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 新浪个股资金流代理：/api/sinaflow?daima=sz002518&page=1&num=5&... → 主力净额（特大单+大单）
                # 与 hq.sinajs.cn 不同主机（vip.stock.finance.sina.com.cn），东财 push2 资金流被封时的兜底
                location = /api/sinaflow {
                    proxy_pass https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/MoneyFlow.ssl_qsfx_lscjfb$is_args$args;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host vip.stock.finance.sina.com.cn;
                    proxy_set_header Referer https://finance.sina.com.cn;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name vip.stock.finance.sina.com.cn;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 新浪行业板块资金流代理：/api/sinasectorflow → 行业主力净流入排行（push2 被封时备源）
                # 数据项：name(行业名), net_in(主力净额/万), r0_net(特大单), r1_net(大单)
                location = /api/sinasectorflow {
                    proxy_pass https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/MoneyFlow.ssl_qsfx_hyzyb$is_args$args;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host vip.stock.finance.sina.com.cn;
                    proxy_set_header Referer https://finance.sina.com.cn;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name vip.stock.finance.sina.com.cn;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 东方财富宏观数据代理：/api/emmacro?reportName=RPT_ECONOMY_CPI&... → 数据中心 JSON
                # 免 key、HTTP/1.1 可代理；用于中国 CPI/PMI/LPR 等已发布宏观数据自动拉取
                location = /api/emmacro {
                    proxy_pass https://datacenter-web.eastmoney.com/api/data/v1/get$is_args$args;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host datacenter-web.eastmoney.com;
                    proxy_set_header Referer https://datacenter.eastmoney.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name datacenter-web.eastmoney.com;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 金十数据代理：/api/jin10?category=ec&attr_id=24 → 美国宏观(失业/联邦利率/核心PCE/PMI 等)
                # 需注入 x-app-id/x-version 头（金十前端公开常量，akshare 同款）；HTTP/1.1
                location = /api/jin10 {
                    proxy_pass https://datacenter-api.jin10.com/reports/list_v2$is_args$args;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host datacenter-api.jin10.com;
                    proxy_set_header Referer https://datacenter.jin10.com/;
                    proxy_set_header Origin https://datacenter.jin10.com;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_set_header x-app-id "rU6QIu7JHe2gOUeR";
                    proxy_set_header x-version "1.0.0";
                    proxy_set_header x-csrf-token "x-csrf-token";
                    proxy_ssl_server_name on;
                    proxy_ssl_name datacenter-api.jin10.com;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 东财行业资金流代理：/api/emflow?fid=f62&fs=m:90+t:2&... → push2 行业板块主力净流入排行
                # 注：push2 曾疑似仅 HTTP/2（黄金那次换了腾讯源）；此处强制 1.1 + 补齐头再试——
                # 若真机 502/超时，前端资金流卡的诊断会显示原始返回，据此换备源
                location = /api/emflow {
                    proxy_pass https://push2.eastmoney.com/api/qt/clist/get$is_args$args;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host push2.eastmoney.com;
                    proxy_set_header Referer https://data.eastmoney.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_set_header Accept "*/*";
                    proxy_ssl_server_name on;
                    proxy_ssl_name push2.eastmoney.com;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 黄金代理：/api/gold → 腾讯伦敦金 hf_XAU（美元/盎司，与股票同源、HTTP/1.1 稳），前端 ×汇率÷31.1 折人民币/克
                # （东方财富 push2 只认 HTTP/2，nginx 无法代理，故用腾讯源）
                location = /api/gold {
                    proxy_pass https://qt.gtimg.cn/q=hf_XAU;
                    proxy_set_header Host qt.gtimg.cn;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_ssl_server_name on;
                    proxy_ssl_name qt.gtimg.cn;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    add_header Cache-Control "no-store";
                }

                # 汇率代理：/api/fxrate → 中国货币网人民币汇率中间价（每日）
                location = /api/fxrate {
                    proxy_pass https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/fx/ccpr.json;
                    proxy_set_header Host www.chinamoney.com.cn;
                    proxy_set_header Referer https://www.chinamoney.com.cn/chinese/bkccpr/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_ssl_server_name on;
                    proxy_ssl_name www.chinamoney.com.cn;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 云端存储：GET 读取 / PUT 写入 单文件 JSON（Nginx 内置 WebDAV，无需额外后端）
                # /api/state → 整份数据（持仓/资产/设置/快照）；/api/snapshots → 旧版仅快照（保留兼容）
                # 与全站一样在访问密码（Basic Auth）之后，仅本人可读写。
                location = /api/state {
                    root /var/lib/investment-intelligence/store;
                    client_body_temp_path /var/lib/investment-intelligence/store/tmp;
                    client_max_body_size 16m;
                    dav_methods PUT;
                    create_full_put_path on;
                    dav_access user:rw group:rw all:r;
                    default_type application/json;
                    charset utf-8;
                    add_header Cache-Control "no-store";
                }
                location = /api/snapshots {
                    root /var/lib/investment-intelligence/store;
                    client_body_temp_path /var/lib/investment-intelligence/store/tmp;
                    client_max_body_size 8m;
                    dav_methods PUT;
                    create_full_put_path on;
                    dav_access user:rw group:rw all:r;
                    default_type application/json;
                    charset utf-8;
                    add_header Cache-Control "no-store";
                }

                # AI 代理：浏览器同源 POST /api/ai-review → DeepSeek（密钥由服务器 include 注入）
                location = /api/ai-review {
                    proxy_pass https://api.deepseek.com/chat/completions;
                    proxy_set_header Host api.deepseek.com;
                    proxy_set_header Content-Type application/json;
                    include /etc/nginx/ai_key.conf;
                    proxy_ssl_server_name on;
                    proxy_ssl_name api.deepseek.com;
                    resolver 119.29.29.29 223.5.5.5 valid=300s ipv6=off;
                    resolver_timeout 5s;
                    proxy_connect_timeout 15s;
                    proxy_read_timeout 120s;
                    proxy_send_timeout 120s;
                    add_header Cache-Control "no-store";
                }

                gzip on;
                gzip_types text/plain text/css application/javascript;
                gzip_min_length 1024;
            }
            NGINXCONF

            # 3) 移除默认站点、校验、重载
            sudo rm -f /etc/nginx/sites-enabled/default
            echo "已部署文件："
            ls -la /var/www/investment-intelligence
            sudo nginx -t
            sudo systemctl reload nginx
            echo "✅ 部署完成，已启用密码访问（用户名 admin）"
