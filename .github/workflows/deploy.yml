name: Deploy to Aliyun ECS

# 触发条件：推送到仓库默认分支时自动部署；也可在 Actions 页手动运行
# 注意：本仓库当前唯一分支为 claude/prototype-development-f9gwtq，
# 原先只列 main/master 会导致推送后部署从不触发。
on:
  push:
    branches: [main, master, claude/prototype-development-f9gwtq]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# 避免并发部署互相覆盖
concurrency:
  group: deploy-ecs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy static files to ECS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "index.html,styles.css,app.js,README.md"
          target: "/var/www/investment-intelligence"
          overwrite: true

      - name: Configure password gate, nginx & reload (SSH)
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          envs: APP_PASSWORD,DEEPSEEK_API_KEY
          script: |
            set -e
            # 1) 用 APP_PASSWORD 生成访问口令文件（用户名固定为 admin）
            if [ -z "$APP_PASSWORD" ]; then
              echo "❌ 未配置 GitHub Secret：APP_PASSWORD"; exit 1
            fi
            echo "admin:$(openssl passwd -apr1 "$APP_PASSWORD")" | sudo tee /etc/nginx/.htpasswd >/dev/null
            sudo chmod 644 /etc/nginx/.htpasswd

            # 1b) 写 DeepSeek 密钥到独立 include 文件（密钥不进主配置、不进前端）
            echo "proxy_set_header Authorization \"Bearer ${DEEPSEEK_API_KEY:-MISSING}\";" | sudo tee /etc/nginx/ai_key.conf >/dev/null
            sudo chmod 600 /etc/nginx/ai_key.conf

            # 1c) 快照云端存储目录（Nginx WebDAV：PUT 写入 / GET 读取 单文件 JSON）
            #     store/api/snapshots 为数据文件；store/tmp 为 PUT 临时目录（须与目标同一文件系统）
            sudo mkdir -p /var/lib/investment-intelligence/store/api /var/lib/investment-intelligence/store/tmp
            sudo chown -R www-data:www-data /var/lib/investment-intelligence
            sudo chmod -R 775 /var/lib/investment-intelligence

            # 2) 写站点配置（含 Basic Auth 密码门）
            sudo tee /etc/nginx/conf.d/investment-intelligence.conf >/dev/null <<'NGINXCONF'
            server {
                listen 80;
                listen [::]:80;
                server_name _;
                root /var/www/investment-intelligence;
                index index.html;

                # 进入网页前的密码验证（用户名 admin，密码来自 APP_PASSWORD）
                auth_basic "请输入访问密码";
                auth_basic_user_file /etc/nginx/.htpasswd;

                location / { try_files $uri $uri/ /index.html; }

                location ~* \.(?:html|css|js)$ {
                    add_header Cache-Control "no-store, must-revalidate";
                    expires -1;
                }

                # 行情代理（主）：浏览器同源 /api/quote?code=sh600000 → 腾讯行情
                location = /api/quote {
                    proxy_pass https://qt.gtimg.cn/q=$arg_code;
                    proxy_set_header Host qt.gtimg.cn;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_ssl_server_name on;
                    proxy_ssl_name qt.gtimg.cn;
                    resolver 119.29.29.29 223.5.5.5 valid=300s;
                    resolver_timeout 5s;
                    add_header Cache-Control "no-store";
                }
                # 行情代理（备）：新浪财经（腾讯失败时前端自动回退到这里）
                location = /api/quote_sina {
                    proxy_pass https://hq.sinajs.cn/list=$arg_code;
                    proxy_set_header Host hq.sinajs.cn;
                    proxy_set_header Referer https://finance.sina.com.cn;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_ssl_server_name on;
                    proxy_ssl_name hq.sinajs.cn;
                    resolver 119.29.29.29 223.5.5.5 valid=300s;
                    resolver_timeout 5s;
                    add_header Cache-Control "no-store";
                }

                # 基金净值代理：/api/fund?code=000051 → 天天基金实时估值（jsonpgz 回包）
                location = /api/fund {
                    proxy_pass https://fundgz.1234567.com.cn/js/$arg_code.js;
                    proxy_set_header Host fundgz.1234567.com.cn;
                    proxy_set_header Referer https://fund.eastmoney.com/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_ssl_server_name on;
                    proxy_ssl_name fundgz.1234567.com.cn;
                    resolver 119.29.29.29 223.5.5.5 valid=300s;
                    resolver_timeout 5s;
                    add_header Cache-Control "no-store";
                }

                # 汇率代理：/api/fxrate → 中国货币网人民币汇率中间价（每日）
                location = /api/fxrate {
                    proxy_pass https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/fx/ccpr.json;
                    proxy_set_header Host www.chinamoney.com.cn;
                    proxy_set_header Referer https://www.chinamoney.com.cn/chinese/bkccpr/;
                    proxy_set_header User-Agent "Mozilla/5.0";
                    proxy_ssl_server_name on;
                    proxy_ssl_name www.chinamoney.com.cn;
                    resolver 119.29.29.29 223.5.5.5 valid=300s;
                    resolver_timeout 5s;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 15s;
                    add_header Cache-Control "no-store";
                }

                # 快照云端存储：GET 读取 / PUT 写入 单文件 JSON（Nginx 内置 WebDAV，无需额外后端）
                # URL /api/snapshots → 文件 /var/lib/investment-intelligence/store/api/snapshots
                # 与全站一样在访问密码（Basic Auth）之后，仅本人可读写。
                location = /api/snapshots {
                    root /var/lib/investment-intelligence/store;
                    client_body_temp_path /var/lib/investment-intelligence/store/tmp;
                    client_max_body_size 8m;
                    dav_methods PUT;
                    create_full_put_path on;
                    dav_access user:rw group:rw all:r;
                    default_type application/json;
                    charset utf-8;
                    add_header Cache-Control "no-store";
                }

                # AI 代理：浏览器同源 POST /api/ai-review → DeepSeek（密钥由服务器 include 注入）
                location = /api/ai-review {
                    proxy_pass https://api.deepseek.com/chat/completions;
                    proxy_set_header Host api.deepseek.com;
                    proxy_set_header Content-Type application/json;
                    include /etc/nginx/ai_key.conf;
                    proxy_ssl_server_name on;
                    proxy_ssl_name api.deepseek.com;
                    resolver 119.29.29.29 223.5.5.5 valid=300s;
                    resolver_timeout 5s;
                    proxy_connect_timeout 15s;
                    proxy_read_timeout 120s;
                    proxy_send_timeout 120s;
                    add_header Cache-Control "no-store";
                }

                gzip on;
                gzip_types text/plain text/css application/javascript;
                gzip_min_length 1024;
            }
            NGINXCONF

            # 3) 移除默认站点、校验、重载
            sudo rm -f /etc/nginx/sites-enabled/default
            echo "已部署文件："
            ls -la /var/www/investment-intelligence
            sudo nginx -t
            sudo systemctl reload nginx
            echo "✅ 部署完成，已启用密码访问（用户名 admin）"
